services:
  - type: web
    name: main-college
    runtime: node
    plan: free
    repo: https://github.com/webilain/Main
    branch: main
    rootDir: Server/Next
    buildCommand: npm ci && npm run build
    startCommand: npm start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
